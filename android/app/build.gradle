plugins { id 'com.android.application' }

android {
    namespace 'com.saebom.dietdiary'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.saebom.dietdiary'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }
    signingConfigs {
        release {
            if (System.getenv('SAEBOM_KEYSTORE_PATH')) {
                storeFile file(System.getenv('SAEBOM_KEYSTORE_PATH'))
                storePassword System.getenv('SAEBOM_STORE_PASSWORD')
                keyAlias System.getenv('SAEBOM_KEY_ALIAS') ?: 'saebom'
                keyPassword System.getenv('SAEBOM_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('SAEBOM_KEYSTORE_PATH')) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
}
